<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Change password — Affidavit Filler</title>
<link rel="stylesheet" href="/assets/auth.css">
<script src="/assets/auth.js" defer></script>
</head>
<body data-page="change-password">
<div class="center">
  <div class="brand">
    <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E4FBF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
    Affidavit Filler
  </div>
  <form class="card narrow" id="form" novalidate>
    <div>
      <h1>Choose a new password</h1>
      <p class="lead" style="margin-top:6px" id="why">Your admin gave you a temporary password. Choose your own before you continue.</p>
    </div>
    <div class="field" id="current-field" hidden>
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required autofocus>
    </div>
    <ul class="rules" id="rules" aria-live="polite"></ul>
    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    </div>
    <div class="alert alert-error" id="error" role="alert" hidden></div>
    <button class="btn btn-primary btn-block" type="submit" id="submit">Save password</button>
    <p class="small muted">You will be signed out on every other device. <a href="#" id="cancel" hidden>Cancel</a> <a href="#" id="signout">Sign out</a></p>
  </form>
</div>
</body>
</html>
